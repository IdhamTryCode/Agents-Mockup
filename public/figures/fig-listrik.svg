<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Poppins, system-ui, sans-serif">
  <rect width="480" height="300" fill="#f6f6f3"/>
  <rect x="1" y="1" width="478" height="298" fill="none" stroke="#e2e1dd"/>
  <text x="240" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Gambar 5. Rangkaian Seri dan Paralel</text>
  <text x="130" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Seri</text>
  <rect x="55" y="80" width="150" height="90" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="105" cy="80" r="9" fill="#f9d84a" stroke="#d4a800"/><circle cx="155" cy="80" r="9" fill="#f9d84a" stroke="#d4a800"/>
  <rect x="120" y="163" width="22" height="14" fill="#333"/>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#444">satu jalur arus</text>
  <text x="350" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Paralel</text>
  <rect x="275" y="80" width="150" height="90" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="350" y1="80" x2="350" y2="170" stroke="#333" stroke-width="2"/>
  <circle cx="312" cy="80" r="9" fill="#f9d84a" stroke="#d4a800"/><circle cx="388" cy="80" r="9" fill="#f9d84a" stroke="#d4a800"/>
  <rect x="339" y="163" width="22" height="14" fill="#333"/>
  <text x="350" y="196" text-anchor="middle" font-size="11" fill="#444">arus bercabang</text>
  <text x="240" y="290" text-anchor="middle" font-size="12" fill="#444">Seri: satu lampu putus, semua padam. Paralel: tetap menyala.</text>
</svg>
