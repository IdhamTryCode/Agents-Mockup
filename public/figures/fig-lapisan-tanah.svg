  <text x="80" y="70" font-size="11" fill="#444">O</text><text x="80" y="115" font-size="11" fill="#444">A</text>
  <text x="80" y="162" font-size="11" fill="#444">B</text><text x="80" y="207" font-size="11" fill="#444">C</text>
  <text x="240" y="290" text-anchor="middle" font-size="12" fill="#444">Makin ke bawah, bahan organik makin sedikit.</text>
